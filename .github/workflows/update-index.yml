name: Regenerate script index

on:
  push:
    branches: [main]
    paths:
      - "public/scripts/**"
      - "config.json"
      - "tools/generate_index.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate index.html
        run: python3 tools/generate_index.py

      - name: Commit and push if changed
        run: |
          git config user.name  "thorhub-indexer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/404.html
          if git diff --cached --quiet; then
            echo "index already up to date - nothing to commit"
          else
            git commit -m "chore: regenerate script index [skip ci]"
            git push
          fi
